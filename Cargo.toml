[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/daemon",
    "crates/app",
    "crates/decky-bridge",
    "crates/manifest-gen",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
repository = "https://github.com/Langepas94/savesync"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
blake3 = "1"
glob = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
interprocess = "2"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
