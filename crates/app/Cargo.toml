[package]
name = "savesync-app"
description = "SaveSync desktop application (Windows / SteamOS Desktop Mode)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
savesync-core = { path = "../core" }
eframe = "0.29"
webbrowser = "1.2.7"

url = "2.5.9"
fs2 = "0.4.3"
rfd = "0.15"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target."cfg(windows)".dependencies]
tray-icon = "0.21.3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
