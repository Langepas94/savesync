[package]
name = "savesync-core"
description = "Core sync engine: manifests, game scanner, snapshots, index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
blake3.workspace = true
glob.workspace = true
zip.workspace = true
ureq.workspace = true
interprocess.workspace = true
fs2 = "0.4.3"
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "sync-secret-service", "crypto-rust"] }
oauth2 = { version = "5.0.0", default-features = false }
url = "2.5.9"
subtle = "2.6.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", features = ["rt-multi-thread", "io-util", "sync", "time", "net"] }
spake2 = "0.4"
rcgen = "0.13.2"
mdns-sd = "0.17"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
